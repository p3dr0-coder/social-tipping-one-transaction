[package]
name = "philia-tips"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Tip preferences for philia: one token per deployment, storage-staked decimal amounts, NEP-297 events."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.1"

[dev-dependencies]
near-sandbox = "0.4.0"
near-api = "0.8.7"
cargo-near-build = "0.11.5"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
anyhow = "1"
