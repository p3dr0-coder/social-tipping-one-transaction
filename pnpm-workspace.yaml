packages:
  - web
  - demo

autoDedupe: true
dedupePeers: true

# pnpm 12 supply-chain policy: allow the 3 freshly-released latest versions.
minimumReleaseAgeExclude:
  - '@eslint/config-array@0.23.6'
  - eslint@10.15.0
  - postcss@8.5.33

# The installed versions are API-compatible with the declaring packages; their
# peer ranges are conservative. Widen the accepted versions so install/peers-check
# is warning-free (documented: https://pnpm.io/settings/peer-dependencies).
peerDependencyRules:
  allowedVersions:
    "@hot-labs/near-connect": "0.12.0"
    eslint: "10"
